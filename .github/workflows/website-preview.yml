name: Website Revamp Preview

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build preview site
        run: |
          rm -rf preview-site
          # Preview the same static routes, assets, and redirects as the site.
          # A curated subset silently returned the homepage for missing routes.
          cp -a web preview-site
          cp web/marketing-v2.html preview-site/index.html
          cp web/preview-overrides.css preview-site/preview-overrides.css
          printf '\n<link rel="stylesheet" href="preview-overrides.css">\n' >> preview-site/index.html
          cp -r assets/images/* preview-site/assets/images/
          echo "Preview bundle ready"

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview-site --project-name=thegearsh-com --branch=website-revamp-v1
